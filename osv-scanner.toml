# 14 packages silenced below are transitive dependencies of dioxus/desktop
# (GTK/WebView/Wry). They are NOT present in the web/server builds and
# cannot be fixed by us — they require upstream dioxus-desktop updates.

[[PackageOverrides]]
name = "atk"
ecosystem = "crates.io"
vulnerability.ignore = true

[[PackageOverrides]]
name = "atk-sys"
ecosystem = "crates.io"
vulnerability.ignore = true

[[PackageOverrides]]
name = "fxhash"
ecosystem = "crates.io"
vulnerability.ignore = true

[[PackageOverrides]]
name = "gdk"
ecosystem = "crates.io"
vulnerability.ignore = true

[[PackageOverrides]]
name = "gdk-sys"
ecosystem = "crates.io"
vulnerability.ignore = true

[[PackageOverrides]]
name = "gdkwayland-sys"
ecosystem = "crates.io"
vulnerability.ignore = true

[[PackageOverrides]]
name = "gdkx11-sys"
ecosystem = "crates.io"
vulnerability.ignore = true

[[PackageOverrides]]
name = "glib"
ecosystem = "crates.io"
vulnerability.ignore = true

[[PackageOverrides]]
name = "gtk"
ecosystem = "crates.io"
vulnerability.ignore = true

[[PackageOverrides]]
name = "gtk-sys"
